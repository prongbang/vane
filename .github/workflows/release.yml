name: Release Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Build and verify release artifacts
    runs-on: macos-15
    timeout-minutes: 60

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Set Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            x86_64-apple-ios \
            aarch64-apple-ios-sim \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

      - name: Install Rust release tools
        run: |
          cargo install cargo-ndk --locked
          # Pinned to match vane-rs/Makefile's `setup:`. `--locked` pins the
          # tool's dependencies, not the tool: unpinned, a warm ~/.cargo/bin
          # keeps an older cargo-swift (0.9 bundles uniffi 0.29, which cannot
          # read 0.31's record-field defaults), and a newer one changes the
          # emitted XCFramework layout under the staleness gate below.
          cargo install cargo-swift --version "^0.11" --locked
          cargo install --path vane-rs/vane-bindgen --locked

      - name: Verify release build
        run: ./scripts/release-build.sh

      - name: Verify generated artifacts are current
        run: git diff --exit-code -- vane-rs VaneKotlin VaneSwift

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: vane-android-aar
          path: VaneKotlin/library/build/outputs/aar/library-release.aar

      - name: Upload Swift XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: vane-swift-xcframework
          path: VaneSwift/RustFramework.xcframework

      # Runs last: fails the job if a device-shipping ABI (arm64-v8a,
      # armeabi-v7a) exceeds the 8 MB uncompressed native payload trigger
      # (PERFORMANCE_PLAN.md "Phase 5b done"). The AAR
      # size is a secondary smoke alarm only and never fails this step.
      # Placed after the uploads above so the oversized artifact is still
      # available to download when this fails.
      - name: Report and gate artifact sizes
        run: ./scripts/report-artifact-sizes.sh "$GITHUB_STEP_SUMMARY"

  live:
    name: Live endpoint tests (advisory)
    runs-on: macos-15
    timeout-minutes: 30
    # Advisory: pie.dev is a correctness endpoint with no SLA
    # (PERFORMANCE_PLAN.md "Live test endpoints, settled 2026-07-29");
    # third-party uptime must never block the release-artifact gate. The
    # job still shows red inside the run when it really fails, and
    # workflow_dispatch exists for a human rerun.
    continue-on-error: true
    env:
      VANE_TEST_BASE_URL: https://pie.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # recursive: RustFramework.xcframework lives inside the VaneSwift
          # submodule — without it `swift test` has no binary target.
          submodules: recursive

      # The xcframework is checked into git, so no Rust build is needed.
      # Runs before the cargo build below so the Swift signal survives a
      # Rust breakage. One in-step retry per suite absorbs a dropped
      # packet (same repeat-on-transient posture the repo already uses),
      # so a red step means "really failing", not "one lost datagram".
      - name: Swift live tests
        timeout-minutes: 10
        working-directory: VaneSwift
        run: swift test || swift test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # NO CARGO_TARGET_DIR here (the release job's env is job-level), so
      # the same-commit host-built cdylib (byte parity with shipped
      # artifacts is separately enforced by the staleness gate) lands at
      # vane-rs/target/release/libvane.dylib — the exact path Dart's
      # _libraryPath() probes.
      - name: Build host dylib
        working-directory: vane-rs
        run: cargo build --release

      # Un-skips the live streaming group AND the parked-upload abort
      # test, whose discrimination (four 64 KiB chunks fill the buffer,
      # the fifth parks) is coupled to the core's
      # BODY_STREAM_BUFFER_BYTES = 256 KiB.
      - name: Dart live streaming tests
        timeout-minutes: 15
        working-directory: vane_flutter
        run: |
          test -f ../vane-rs/target/release/libvane.dylib  # fail loud; never let the group skip silently
          flutter test test/vane_flutter_ffi_test.dart || flutter test test/vane_flutter_ffi_test.dart
