name: Release Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Build and verify release artifacts
    runs-on: macos-15
    timeout-minutes: 60

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Set Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            x86_64-apple-ios \
            aarch64-apple-ios-sim \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

      - name: Install Rust release tools
        run: |
          cargo install cargo-ndk --locked
          # Pinned to match vane-rs/Makefile's `setup:`. `--locked` pins the
          # tool's dependencies, not the tool: unpinned, a warm ~/.cargo/bin
          # keeps an older cargo-swift (0.9 bundles uniffi 0.29, which cannot
          # read 0.31's record-field defaults), and a newer one changes the
          # emitted XCFramework layout under the staleness gate below.
          cargo install cargo-swift --version "^0.11" --locked
          cargo install --path vane-rs/vane-bindgen --locked

      - name: Verify release build
        run: ./scripts/release-build.sh

      - name: Verify generated artifacts are current
        run: git diff --exit-code -- vane-rs VaneKotlin VaneSwift

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: vane-android-aar
          path: VaneKotlin/library/build/outputs/aar/library-release.aar

      - name: Upload Swift XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: vane-swift-xcframework
          path: VaneSwift/RustFramework.xcframework

      # Runs last: fails the job if a device-shipping ABI (arm64-v8a,
      # armeabi-v7a) exceeds the 8 MB uncompressed native payload trigger
      # (PLAN.md gate 11/12, PERFORMANCE_PLAN.md "Phase 5b done"). The AAR
      # size is a secondary smoke alarm only and never fails this step.
      # Placed after the uploads above so the oversized artifact is still
      # available to download when this fails.
      - name: Report and gate artifact sizes
        run: ./scripts/report-artifact-sizes.sh "$GITHUB_STEP_SUMMARY"
